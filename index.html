<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #191919;
    --card-bg: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.08);
    --text-primary: #ffffffee;
    --text-secondary: rgba(255,255,255,0.5);
    --accent: #147EA3;
    --accent-glow: rgba(20,126,163,0.25);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .widget {
    width: 100%;
    max-width: 720px;
    padding: 32px 36px;
    position: relative;
  }

  .widget::before {
    content: '';
    position: absolute;
    top: -40px;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
    pointer-events: none;
    opacity: 0;
    animation: glowIn 2s ease-out 0.5s forwards;
  }

  @keyframes glowIn { to { opacity: 1; } }

  .greeting-line {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    opacity: 0;
    transform: translateY(12px);
    animation: fadeUp 0.8s ease-out 0.2s forwards;
  }

  .greeting-text {
    font-family: 'Instrument Serif', serif;
    font-size: 2.1rem;
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.2;
    background: linear-gradient(135deg, var(--text-primary) 30%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .wave {
    display: inline-block;
    font-size: 1.8rem;
    animation: wave 2.5s ease-in-out infinite;
    transform-origin: 70% 70%;
    -webkit-text-fill-color: initial;
  }

  @keyframes wave {
    0%, 100% { transform: rotate(0deg); }
    10% { transform: rotate(14deg); }
    20% { transform: rotate(-8deg); }
    30% { transform: rotate(14deg); }
    40% { transform: rotate(-4deg); }
    50% { transform: rotate(10deg); }
    60%, 100% { transform: rotate(0deg); }
  }

  .info-row {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 14px;
    flex-wrap: wrap;
    opacity: 0;
    transform: translateY(12px);
    animation: fadeUp 0.8s ease-out 0.5s forwards;
  }

  .info-chip {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 14px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 100px;
    font-size: 0.85rem;
    font-weight: 400;
    color: var(--text-secondary);
    backdrop-filter: blur(8px);
    transition: border-color 0.3s, color 0.3s;
  }

  .info-chip:hover {
    border-color: rgba(255,255,255,0.15);
    color: var(--text-primary);
  }

  .info-chip .icon { font-size: 1rem; line-height: 1; }
  .info-chip .label { font-variant-numeric: tabular-nums; }

  .separator {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
  }

  .temp-value { color: var(--accent); font-weight: 500; }
  .weather-desc { text-transform: capitalize; }

  .date-line {
    margin-top: 12px;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.25);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 0.8s ease-out 0.8s forwards;
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .weather-loading {
    display: inline-block;
    width: 48px;
    height: 10px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 4px;
  }

  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  @media (max-width: 500px) {
    .widget { padding: 24px 20px; }
    .greeting-text { font-size: 1.6rem; }
    .info-row { gap: 10px; }
    .info-chip { padding: 5px 10px; font-size: 0.78rem; }
  }
</style>
</head>
<body>

<div class="widget">
  <div class="greeting-line">
    <span class="greeting-text" id="greeting">Good morning, Jordan</span>
    <span class="wave">👋</span>
  </div>

  <div class="info-row">
    <div class="info-chip">
      <span class="icon">🕐</span>
      <span class="label" id="clock">--:--</span>
    </div>
    <span class="separator"></span>
    <div class="info-chip" id="weather-chip">
      <span class="icon" id="weather-icon">🌤</span>
      <span class="label" id="weather-text"><span class="weather-loading"></span></span>
    </div>
  </div>

  <div class="date-line" id="date-line"></div>
</div>

<script>
  // ── Configuration ──
  const CONFIG = {
    name: 'Jordan',
    lat: 44.9461,       // Middleton, NS
    lon: -65.0686,
    timezone: 'America/Halifax'
  };

  // ── Time & Greeting ──
  function updateTime() {
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes().toString().padStart(2, '0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    const h12 = h % 12 || 12;

    document.getElementById('clock').textContent = `${h12}:${m} ${ampm}`;

    let period;
    if (h >= 5 && h < 12) period = 'morning';
    else if (h >= 12 && h < 17) period = 'afternoon';
    else if (h >= 17 && h < 21) period = 'evening';
    else period = 'night';

    document.getElementById('greeting').textContent = `Good ${period}, ${CONFIG.name}`;

    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('date-line').textContent = now.toLocaleDateString('en-CA', options);
  }

  updateTime();
  setInterval(updateTime, 10000);

  // ── Weather (Open-Meteo — free, no API key) ──
  async function fetchWeather() {
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}&current=temperature_2m,weathercode,windspeed_10m&timezone=${CONFIG.timezone}`;
      const res = await fetch(url);
      const data = await res.json();
      const temp = Math.round(data.current.temperature_2m);
      const code = data.current.weathercode;
      const wind = Math.round(data.current.windspeed_10m);
      const { icon, desc } = weatherDecode(code);

      document.getElementById('weather-icon').textContent = icon;
      document.getElementById('weather-text').innerHTML =
        `<span class="temp-value">${temp}°C</span>&nbsp;&nbsp;<span class="weather-desc">${desc}</span>&nbsp;&nbsp;💨 ${wind} km/h`;
    } catch (e) {
      document.getElementById('weather-text').textContent = 'Weather unavailable';
    }
  }

  function weatherDecode(code) {
    const map = {
      0:  { icon: '☀️', desc: 'Clear skies' },
      1:  { icon: '🌤', desc: 'Mostly clear' },
      2:  { icon: '⛅', desc: 'Partly cloudy' },
      3:  { icon: '☁️', desc: 'Overcast' },
      45: { icon: '🌫', desc: 'Foggy' },
      48: { icon: '🌫', desc: 'Freezing fog' },
      51: { icon: '🌦', desc: 'Light drizzle' },
      53: { icon: '🌦', desc: 'Drizzle' },
      55: { icon: '🌧', desc: 'Heavy drizzle' },
      56: { icon: '🌧', desc: 'Freezing drizzle' },
      57: { icon: '🌧', desc: 'Heavy freezing drizzle' },
      61: { icon: '🌧', desc: 'Light rain' },
      63: { icon: '🌧', desc: 'Rain' },
      65: { icon: '🌧', desc: 'Heavy rain' },
      66: { icon: '🌧', desc: 'Freezing rain' },
      67: { icon: '🌧', desc: 'Heavy freezing rain' },
      71: { icon: '🌨', desc: 'Light snow' },
      73: { icon: '🌨', desc: 'Snow' },
      75: { icon: '❄️', desc: 'Heavy snow' },
      77: { icon: '🌨', desc: 'Snow grains' },
      80: { icon: '🌦', desc: 'Light showers' },
      81: { icon: '🌧', desc: 'Showers' },
      82: { icon: '⛈', desc: 'Heavy showers' },
      85: { icon: '🌨', desc: 'Light snow showers' },
      86: { icon: '❄️', desc: 'Heavy snow showers' },
      95: { icon: '⛈', desc: 'Thunderstorm' },
      96: { icon: '⛈', desc: 'Thunderstorm with hail' },
      99: { icon: '⛈', desc: 'Severe thunderstorm' },
    };
    return map[code] || { icon: '🌡', desc: 'Weather data' };
  }

  fetchWeather();
  setInterval(fetchWeather, 900000); // Refresh every 15 min
</script>

</body>
</html>
